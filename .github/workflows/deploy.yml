# 每次 push 到 main 分支時，自動建置並部署到 GitHub Pages
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:   # 也可以在 Actions 頁面手動執行

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v7

      - name: 安裝 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: 安裝套件
        run: npm ci

      - name: 建置專案
        run: npm run build

      - name: 設定 GitHub Pages
        uses: actions/configure-pages@v6

      - name: 上傳建置結果
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v5